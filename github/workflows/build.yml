      - name: Spieldaten laden
        working-directory: ivisor
        run: |
          mkdir -p data app/src/main/assets
          B=https://raw.githubusercontent.com
          curl -fsSL -o data/pvpoke.json $B/pvpoke/pvpoke/master/src/data/gamemaster.min.json
          for c in 500 1500 2500 10000; do curl -fsSL -o data/r$c.json $B/pvpoke/pvpoke/master/src/data/rankings/all/overall/rankings-$c.json; done
          curl -fsSL -o data/latest.json $B/PokeMiners/game_masters/master/latest/latest.json
          for l in german english; do curl -fsSL -o data/i18n_$l.json "$B/PokeMiners/pogo_assets/master/Texts/Latest%20APK/JSON/i18n_$l.json"; done
          python3 tools/build_data.py data/ > /dev/null
          ls -la app/src/main/assets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: APK bauen
        working-directory: ivisor
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: IVisor-apk
          path: ivisor/app/build/outputs/apk/release/*.apk
